name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: dotnet build src/PalworldServerEditor/PalworldServerEditor.csproj -c Release

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: PalworldServerEditor
          path: src/PalworldServerEditor/bin/Release/net48/PalworldServerEditor.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src/PalworldServerEditor/bin/Release/net48/PalworldServerEditor.exe
